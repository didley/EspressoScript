name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Lint src
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Build site
        run: npm run build:site

      - name: Run rule fixture tests
        run: node --import tsx/esm tests/runner.ts

      - name: Run std tests
        run: node --import tsx/esm --test tests/std.test.ts

  lint-examples:
    name: Lint examples
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check examples
        run: node --import tsx/esm scripts/check-examples.mjs
