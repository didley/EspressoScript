name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify shot CLI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run fixture tests
        run: |
          bun run tests/run-syntax-fixtures.ts
          bun run tests/run-types-fixtures.ts
          bun run tests/run-imports-fixtures.ts

      - name: Run integration tests
        run: bash scripts/verify.sh

  rules-submodule:
    name: shot-lint submodule
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: lint/package.json

      - name: Install shot-lint dependencies
        working-directory: lint
        run: npm ci

      - name: Build shot-lint
        working-directory: lint
        run: npm run build

      - name: Run shot-lint tests
        working-directory: lint
        run: node --import tsx/esm tests/runner.ts

      - name: Run shot-lint utils tests
        working-directory: lint
        run: node --import tsx/esm --test tests/utils.test.ts
