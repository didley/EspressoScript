<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0d10"/>
      <stop offset="100%" stop-color="#12121a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#c8702a" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#c8702a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Dot grid (decorative) -->
  <g opacity="0.18" fill="#c8702a">
    <rect x="80"  y="80"  width="3" height="3" rx="1.5"/>
    <rect x="140" y="80"  width="3" height="3" rx="1.5"/>
    <rect x="200" y="80"  width="3" height="3" rx="1.5"/>
    <rect x="260" y="80"  width="3" height="3" rx="1.5"/>
    <rect x="320" y="80"  width="3" height="3" rx="1.5"/>
    <rect x="380" y="80"  width="3" height="3" rx="1.5"/>
    <rect x="80"  y="140" width="3" height="3" rx="1.5"/>
    <rect x="140" y="140" width="3" height="3" rx="1.5"/>
    <rect x="200" y="140" width="3" height="3" rx="1.5"/>
    <rect x="260" y="140" width="3" height="3" rx="1.5"/>
    <rect x="320" y="140" width="3" height="3" rx="1.5"/>
    <rect x="380" y="140" width="3" height="3" rx="1.5"/>
    <rect x="80"  y="200" width="3" height="3" rx="1.5"/>
    <rect x="140" y="200" width="3" height="3" rx="1.5"/>
    <rect x="200" y="200" width="3" height="3" rx="1.5"/>
    <rect x="260" y="200" width="3" height="3" rx="1.5"/>
    <rect x="320" y="200" width="3" height="3" rx="1.5"/>
    <rect x="940" y="80"  width="3" height="3" rx="1.5"/>
    <rect x="1000" y="80" width="3" height="3" rx="1.5"/>
    <rect x="1060" y="80" width="3" height="3" rx="1.5"/>
    <rect x="1120" y="80" width="3" height="3" rx="1.5"/>
    <rect x="940" y="140" width="3" height="3" rx="1.5"/>
    <rect x="1000" y="140" width="3" height="3" rx="1.5"/>
    <rect x="1060" y="140" width="3" height="3" rx="1.5"/>
    <rect x="1120" y="140" width="3" height="3" rx="1.5"/>
    <rect x="940" y="200" width="3" height="3" rx="1.5"/>
    <rect x="1000" y="200" width="3" height="3" rx="1.5"/>
    <rect x="1060" y="200" width="3" height="3" rx="1.5"/>
    <rect x="1120" y="200" width="3" height="3" rx="1.5"/>
    <rect x="940" y="500" width="3" height="3" rx="1.5"/>
    <rect x="1000" y="500" width="3" height="3" rx="1.5"/>
    <rect x="1060" y="500" width="3" height="3" rx="1.5"/>
    <rect x="1120" y="500" width="3" height="3" rx="1.5"/>
    <rect x="940" y="560" width="3" height="3" rx="1.5"/>
    <rect x="1000" y="560" width="3" height="3" rx="1.5"/>
    <rect x="1060" y="560" width="3" height="3" rx="1.5"/>
    <rect x="1120" y="560" width="3" height="3" rx="1.5"/>
  </g>

  <!-- Logo mark top-left -->
  <rect x="80" y="72" width="52" height="52" rx="10" fill="#16161a" stroke="#2a2a32" stroke-width="1"/>
  <text x="106" y="106" font-family="'SF Mono', 'Fira Code', ui-monospace, monospace" font-size="22" font-weight="700" fill="#c8702a" text-anchor="middle">ss</text>

  <!-- Early access chip -->
  <rect x="80" y="216" width="180" height="28" rx="14" fill="#c8702a" fill-opacity="0.08" stroke="#c8702a" stroke-opacity="0.25" stroke-width="1"/>
  <circle cx="100" cy="230" r="4" fill="#c8702a"/>
  <text x="114" y="235" font-family="'SF Mono', 'Fira Code', ui-monospace, monospace" font-size="11" fill="#7a7a90" letter-spacing="1">EARLY ACCESS</text>

  <!-- Main headline -->
  <text x="80" y="330" font-family="'SF Mono', 'Fira Code', ui-monospace, monospace" font-size="88" font-weight="700" fill="#e8e8f0" letter-spacing="-2">ShotScript</text>

  <!-- Tagline -->
  <text x="82" y="386" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" fill="#7a7a90">One way to write JavaScript and TypeScript.</text>

  <!-- Syntax reduction visual -->
  <!-- TypeScript bar -->
  <text x="82" y="450" font-family="'SF Mono', 'Fira Code', ui-monospace, monospace" font-size="13" fill="#7a7a90">TypeScript</text>
  <rect x="82" y="458" width="580" height="8" rx="3" fill="#2a2a32"/>
  <!-- ShotScript bar (21% of 580 = ~122) -->
  <text x="82" y="496" font-family="'SF Mono', 'Fira Code', ui-monospace, monospace" font-size="13" fill="#7a7a90">ShotScript</text>
  <rect x="82" y="504" width="122" height="8" rx="3" fill="#c8702a"/>

  <!-- Reduction label -->
  <text x="82" y="540" font-family="'SF Mono', 'Fira Code', ui-monospace, monospace" font-size="13" fill="#c8702a">~79% of syntax removed</text>

  <!-- Right side — reduction numbers -->
  <rect x="820" y="260" width="300" height="310" rx="12" fill="#16161a" stroke="#2a2a32" stroke-width="1"/>
  <text x="840" y="294" font-family="'SF Mono', 'Fira Code', ui-monospace, monospace" font-size="11" fill="#c8702a" letter-spacing="1.5">FEWER WAYS TO SAY THE SAME THING</text>

  <rect x="840" y="310" width="36" height="22" rx="4" fill="#c8702a" fill-opacity="0.12" stroke="#c8702a" stroke-opacity="0.3" stroke-width="1"/>
  <text x="858" y="326" font-family="'SF Mono', 'Fira Code', ui-monospace, monospace" font-size="12" font-weight="700" fill="#c8702a" text-anchor="middle">4</text>
  <text x="886" y="326" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#7a7a90">function forms → one</text>

  <rect x="840" y="344" width="36" height="22" rx="4" fill="#c8702a" fill-opacity="0.12" stroke="#c8702a" stroke-opacity="0.3" stroke-width="1"/>
  <text x="858" y="360" font-family="'SF Mono', 'Fira Code', ui-monospace, monospace" font-size="12" font-weight="700" fill="#c8702a" text-anchor="middle">5</text>
  <text x="886" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#7a7a90">error patterns → one</text>

  <rect x="840" y="378" width="36" height="22" rx="4" fill="#c8702a" fill-opacity="0.12" stroke="#c8702a" stroke-opacity="0.3" stroke-width="1"/>
  <text x="858" y="394" font-family="'SF Mono', 'Fira Code', ui-monospace, monospace" font-size="12" font-weight="700" fill="#c8702a" text-anchor="middle">3</text>
  <text x="886" y="394" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#7a7a90">variable forms → const</text>

  <rect x="840" y="412" width="36" height="22" rx="4" fill="#c8702a" fill-opacity="0.12" stroke="#c8702a" stroke-opacity="0.3" stroke-width="1"/>
  <text x="858" y="428" font-family="'SF Mono', 'Fira Code', ui-monospace, monospace" font-size="12" font-weight="700" fill="#c8702a" text-anchor="middle">7</text>
  <text x="886" y="428" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#7a7a90">OOP constructs → banned</text>

  <rect x="840" y="446" width="36" height="22" rx="4" fill="#c8702a" fill-opacity="0.12" stroke="#c8702a" stroke-opacity="0.3" stroke-width="1"/>
  <text x="858" y="462" font-family="'SF Mono', 'Fira Code', ui-monospace, monospace" font-size="12" font-weight="700" fill="#c8702a" text-anchor="middle">6</text>
  <text x="886" y="462" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#7a7a90">conditional forms → if/else</text>

  <rect x="840" y="480" width="36" height="22" rx="4" fill="#c8702a" fill-opacity="0.12" stroke="#c8702a" stroke-opacity="0.3" stroke-width="1"/>
  <text x="858" y="496" font-family="'SF Mono', 'Fira Code', ui-monospace, monospace" font-size="12" font-weight="700" fill="#c8702a" text-anchor="middle">6</text>
  <text x="886" y="496" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#7a7a90">escape hatches → banned</text>

  <text x="840" y="548" font-family="'SF Mono', 'Fira Code', ui-monospace, monospace" font-size="11" fill="#2a2a32">shotscript.dev</text>
</svg>
